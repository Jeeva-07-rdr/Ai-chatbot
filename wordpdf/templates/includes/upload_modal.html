        <!-- Dynamic Upload Control Panel -->
        <div class="upload-panel" id="uploadPanel">
            <div class="upload-title-bar">
                <h3 class="upload-title" id="panelTitle">
                    <i class="fas fa-sync-alt"></i> Tool Name
                </h3>
                <button class="close-panel" onclick="closeUploadPanel()"><i class="fas fa-times"></i></button>
            </div>
            
            <form method="POST" enctype="multipart/form-data" id="toolForm">
                {% csrf_token %}
                <input type="hidden" name="action_type" id="formActionType">
                <input type="hidden" name="conversion_type" id="formConversionType">
                <input type="hidden" name="merge_format" id="formMergeFormat">
                
                <div class="drop-zone text-center" id="uploadDropZone">
                    <i class="fas fa-cloud-upload-alt drop-zone-icon" id="dropZoneIcon"></i>
                    <h4 id="dropZoneTitle">Drag & Drop File(s) Here</h4>
                    <p class="text-muted" id="dropZoneDesc">Supports target formats</p>
                    
                    <!-- Conditional inputs container -->
                    <div id="dynamicInputs" class="mb-3 mx-auto" style="max-width: 350px;"></div>
                    
                    <input type="file" id="uploadFileInput" name="documentfile" class="form-control d-none">
                    <button type="button" class="btn-outline-custom mb-2" id="chooseFileBtn">Choose Files</button>
                    <div id="uploadFileDisplay" class="mt-2"></div>
                </div>
                
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-action" id="submitActionBtn">
                        Process Files
                    </button>
                </div>
            </form>
        </div>
