// Dynamic File list builder utility
class FileListManager {
    static _abortController = null;

    constructor(dropZoneId, fileInputId, fileDisplayId, isMultiple = false) {
        this.dropZone = document.getElementById(dropZoneId);
        this.fileInput = document.getElementById(fileInputId);
        this.fileDisplay = document.getElementById(fileDisplayId);
        this.isMultiple = isMultiple;
        this.files = [];
        this.init();
    }

    init() {
        if (!this.dropZone || !this.fileInput || !this.fileDisplay) return;
        
        if (FileListManager._abortController) {
            FileListManager._abortController.abort();
        }
        FileListManager._abortController = new AbortController();
        const signal = FileListManager._abortController.signal;

        // Drag events
        this.dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            this.dropZone.style.borderColor = "var(--accent-blue)";
            this.dropZone.style.background = "#f0f7ff";
        }, { signal });

        this.dropZone.addEventListener("dragleave", () => {
            this.dropZone.style.borderColor = "#cbd5e1";
            this.dropZone.style.background = "#f8fafc";
        }, { signal });

        this.dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            this.addFiles(e.dataTransfer.files);
            this.dropZone.style.borderColor = "#cbd5e1";
            this.dropZone.style.background = "#f8fafc";
        }, { signal });

        this.fileInput.addEventListener("change", () => {
            if (this.fileInput.files && this.fileInput.files.length > 0) {
                this.addFiles(this.fileInput.files);
            }
        }, { signal });

        // Click anywhere on the drop zone to browse (except buttons/inputs)
        this.dropZone.addEventListener("click", (e) => {
            if (e.target.closest("button, input, select, a, label, .pdf-editor-launcher, .word-editor-launcher, .file-list-card")) {
                return;
            }
            this.openFilePicker();
        }, { signal });

        // Choose files button
        const chooseBtn = document.getElementById("chooseFileBtn");
        if (chooseBtn) {
            chooseBtn.onclick = () => this.openFilePicker();
        }
    }

    openFilePicker() {
        this.fileInput.value = "";
        this.fileInput.click();
    }

    addFiles(fileList) {
        // Clear templates alerts
        const successAlert = document.getElementById("successAlert");
        if (successAlert) successAlert.style.display = "none";
        const errorAlert = document.getElementById("errorAlert");
        if (errorAlert) errorAlert.style.display = "none";

        if (!this.isMultiple) {
            if (fileList.length > 0) {
                this.files = [fileList[0]];
            }
        } else {
            for (let i = 0; i < fileList.length; i++) {
                const file = fileList[i];
                if (!this.files.some(f => f.name === file.name && f.size === file.size)) {
                    this.files.push(file);
                }
            }
        }
        this.updateInputAndUI();
    }

    removeFile(index) {
        this.files.splice(index, 1);
        this.updateInputAndUI();
        if (window.currentToolConfig && window.currentToolConfig.showWordEditor) {
            if (this.files.length > 0) {
                if (window.currentToolConfig.actionType === "edit_pdf") {
                    loadPdfEditorFile(this.files[0]);
                } else {
                    loadWordEditorFile(this.files[0]);
                }
            } else {
                resetWordEditor();
            }
        }
        if (window.currentToolConfig && window.currentToolConfig.showPdfEditor) {
            if (this.files.length > 0) {
                loadPdfEditorFile(this.files[0]);
            } else {
                resetPdfEditor();
            }
        }
    }

    updateInputAndUI() {
        const dt = new DataTransfer();
        this.files.forEach(file => dt.items.add(file));
        this.fileInput.files = dt.files;

        if (this.files.length > 0) {
            let html = `<div class="mt-3 text-start file-list-card p-3 rounded shadow-sm border" style="max-height: 200px; overflow-y: auto;">`;
            html += `<h6 class="fw-bold text-dark mb-2">Selected Files (${this.files.length}):</h6>`;
            html += `<ul class="list-group list-group-flush">`;
            
            this.files.forEach((file, index) => {
                const sizeKB = (file.size / 1024).toFixed(1);
                html += `
                <li class="list-group-item d-flex justify-content-between align-items-center py-2 px-1">
                    <div class="text-truncate" style="max-width: 85%;">
                        <i class="far fa-file-alt text-primary me-2"></i>
                        <span class="text-dark small fw-semibold">${file.name}</span>
                        <span class="text-muted small ms-2">(${sizeKB} KB)</span>
                    </div>
                    <button type="button" class="btn btn-sm btn-link text-danger p-0 border-0" onclick="window.activeFileManager.removeFile(${index})">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </li>`;
            });
            
            html += `</ul></div>`;
            this.fileDisplay.innerHTML = html;
        } else {
            this.fileDisplay.innerHTML = "";
        }
        // If tool has PDF editor, load the file into editor
        if (window.currentToolConfig && window.currentToolConfig.showWordEditor) {
            if (this.files.length > 0) {
                if (window.currentToolConfig.actionType === "edit_pdf") {
                    loadPdfEditorFile(this.files[0]);
                } else {
                    loadWordEditorFile(this.files[0]);
                }
            } else {
                resetWordEditor();
            }
        }
        if (window.currentToolConfig && window.currentToolConfig.showPdfEditor) {
            this.files.length > 0 ? loadPdfEditorFile(this.files[0]) : resetPdfEditor();
        }
    }
}

function resetWordEditor() {
    wordEditorState.originalName = "";
    wordEditorState.uploadedFilename = "";
    wordEditorState.fileLoaded = false;
    wordEditorState.saveAs = "docx";
    const canvas = document.getElementById("wordEditorCanvas");
    if (canvas) canvas.innerHTML = "";
    closeWordWorkspace();
}

async function loadWordEditorFile(file) {
    if (!file || !file.name.toLowerCase().endsWith(".docx")) {
        resetWordEditor();
        return;
    }
    wordEditorState.saveAs = "docx";
    const inputsContainer = document.getElementById("dynamicInputs");
    const originalContent = inputsContainer.innerHTML;
    inputsContainer.innerHTML = `
        <div class="text-center py-4">
            <div class="spinner-border text-primary mb-2" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted small mb-0">Importing and converting Word document...</p>
        </div>
    `;
    
    try {
        const formData = new FormData();
        formData.append("action_type", "word_edit");
        formData.append("editwordfile", file);
        formData.append("csrfmiddlewaretoken", document.querySelector('[name=csrfmiddlewaretoken]').value);
        
        const response = await fetch("/", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        
        if (data.success) {
            wordEditorState.originalName = data.original_name;
            wordEditorState.uploadedFilename = data.filename;
            wordEditorState.fileLoaded = true;
            
            document.getElementById("wordEditorCanvas").innerHTML = data.html || "<p><br></p>";
            
            inputsContainer.innerHTML = _wordEditorHTML("word");
            _setupWordEditorListeners();
            
            openWordWorkspace();
        } else {
            throw new Error(data.error || "Failed to convert document.");
        }
    } catch(e) {
        inputsContainer.innerHTML = originalContent;
        _setupWordEditorListeners();
        alert("Could not load this Word document: " + e.message);
        resetWordEditor();
    }
}

function openWordWorkspace() {
    if (!wordEditorState.fileLoaded) return;
    const modal = document.getElementById("wordModal");
    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
    document.getElementById("wordDocName").textContent = wordEditorState.originalName;

    const saveBtn = document.getElementById("wordSaveBtn");
    if (saveBtn) {
        saveBtn.innerHTML = wordEditorState.saveAs === "pdf"
            ? '<i class="fas fa-save me-1"></i> Save as PDF'
            : '<i class="fas fa-save me-1"></i> Save Changes';
    }
    
    const canvas = document.getElementById("wordEditorCanvas");
    if (canvas) {
        canvas.focus();
        const sel = window.getSelection();
        if (sel.rangeCount === 0 || !canvas.contains(sel.anchorNode)) {
            const range = document.createRange();
            range.selectNodeContents(canvas);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }
        saveWordSelection();
    }
}

function closeWordWorkspace() {
    const modal = document.getElementById("wordModal");
    if (modal) modal.style.display = "none";
    document.body.style.overflow = "";
}

// ─── Word Editor: selection tracking ────────────────────────────────────────
let _wordSel = null; // stores the last known Range inside the word canvas

// Auto-save the selection whenever it changes – but ONLY when it's inside the canvas
document.addEventListener("selectionchange", function () {
    const canvas = document.getElementById("wordEditorCanvas");
    if (!canvas) return;
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
        const r = sel.getRangeAt(0);
        // Only save when the anchor is actually inside the canvas
        if (canvas.contains(r.commonAncestorContainer)) {
            _wordSel = r.cloneRange();
        }
    }
});

// Restore the saved selection back into the canvas
function restoreWordSel() {
    const canvas = document.getElementById("wordEditorCanvas");
    if (!canvas) return;
    canvas.focus(); // focus FIRST so commands work
    if (_wordSel) {
        try {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(_wordSel);
        } catch (e) { /* ignore cross-doc errors */ }
    }
}

// Legacy aliases kept for any inline HTML that still calls the old names
function saveWordSelection() {
    // No-op: selection is auto-saved by the selectionchange listener
}
function restoreWordSelection() {
    restoreWordSel();
}

// Keep the text selection when using ribbon controls (not when dragging the scrollbar)
function wordRibbonMouseDown(event) {
    const tag = event.target.tagName;
    if (tag === "SELECT" || tag === "INPUT" || tag === "OPTION") return;
    const el = event.currentTarget;
    if (event.offsetY > el.clientHeight - 8) return;
    event.preventDefault();
}

// ─── Execute a formatting command ────────────────────────────────────────────
function execWordCmd(command, value) {
    restoreWordSel();
    const canvas = document.getElementById("wordEditorCanvas");
    if (canvas && !canvas.contains(document.activeElement)) {
        canvas.focus();
    }
    document.execCommand(command, false, value !== undefined ? value : null);
    // Sync Bold/Italic/Underline/Strike button active states
    const map = { bold: "wordBtnBold", italic: "wordBtnItalic", underline: "wordBtnUnderline", strikeThrough: "wordBtnStrike" };
    Object.entries(map).forEach(([cmd, id]) => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.toggle("active", document.queryCommandState(cmd));
    });
}

// Legacy alias
function updateWordToolbarState() {
    const map = { bold: "wordBtnBold", italic: "wordBtnItalic", underline: "wordBtnUnderline", strikeThrough: "wordBtnStrike" };
    Object.entries(map).forEach(([cmd, id]) => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.toggle("active", document.queryCommandState(cmd));

}

function toggleWordFindReplace() {
    const bar = document.getElementById("wordFindReplaceBar");
    if (bar.style.display === "none") {
        bar.style.display = "block";
        document.getElementById("wordFindInput").focus();
    } else {
        bar.style.display = "none";
    }
}

function wordFindAndReplace(replaceAll = false) {
    const findText = document.getElementById("wordFindInput").value;
    const replaceText = document.getElementById("wordReplaceInput").value;
    if (!findText) {
        alert("Please enter text to find.");
        return;
    }
    
    const canvas = document.getElementById("wordEditorCanvas");
    if (replaceAll) {
        const escFind = findText.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const regex = new RegExp(escFind, 'g');
        canvas.innerHTML = canvas.innerHTML.replace(regex, replaceText);
        alert("Replaced all occurrences of '" + findText + "'");
    } else {
        const found = window.find(findText, false, false, true, false, true, false);
        if (found) {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                range.deleteContents();
                range.insertNode(document.createTextNode(replaceText));
                canvas.focus();
            }
        } else {
            alert("No more occurrences of '" + findText + "' found.");
        }
    }
}

function showDownloadSuccess(downloadUrl, fileName) {
    const successAlert = document.getElementById("successAlert");
    const dlBtn = document.getElementById("downloadBtn");
    if (successAlert) {
        successAlert.style.display = "block";
        if (dlBtn) dlBtn.href = downloadUrl;
        successAlert.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    if (fileName) logDownload(fileName, downloadUrl);
    triggerConfetti();
}

async function saveWordDocument() {
    const saveBtn = document.getElementById("wordSaveBtn");
    const originalHTML = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1" role="status"></span> Saving...`;
    
    try {
        const htmlContent = document.getElementById("wordEditorCanvas").innerHTML;
        
        const formData = new FormData();
        formData.append("action_type", wordEditorState.saveAs === "pdf" ? "pdf_edit_save" : "word_edit_save");
        formData.append("original_name", wordEditorState.originalName);
        formData.append("uploaded_filename", wordEditorState.uploadedFilename);
        formData.append("html_content", htmlContent);
        formData.append("csrfmiddlewaretoken", document.querySelector('[name=csrfmiddlewaretoken]').value);
        
        const response = await fetch("/", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        
        if (data.success) {
            closeWordWorkspace();
            showDownloadSuccess(data.download_url, data.download_url.split('/').pop());
        } else {
            throw new Error(data.error || "Save operation failed.");
        }
    } catch(e) {
        alert("Could not save document: " + e.message);
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalHTML;
    }
}

async function loadPdfEditorFile(file) {
    if (!file || !file.name.toLowerCase().endsWith(".pdf")) {
        resetPdfEditor();
        return;
    }

    resetPdfEditor();

    const info = document.getElementById("launcherDocInfo");
    const launchBtn = document.getElementById("launchAcrobatBtn");
    if (info) {
        info.textContent = "Opening PDF for editing...";
        info.classList.remove("text-success");
        info.classList.add("text-muted");
    }
    if (launchBtn) launchBtn.disabled = true;

    try {
        _initPdfJs();
        pdfEditorState.fileUrl = URL.createObjectURL(file);
        pdfEditorState.pdfDoc = await pdfjsLib.getDocument({ url: pdfEditorState.fileUrl }).promise;
        _setPdfLauncherReady(file.name, pdfEditorState.pdfDoc.numPages);
    } catch (e) {
        resetPdfEditor();
        alert("Could not open this PDF for editing. Please upload a valid, unencrypted PDF file.");
    }
}

function openAcrobatWorkspace() {
    if (!pdfEditorState.pdfDoc) return;
    
    const modal = document.getElementById("acrobatModal");
    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
    
    const file = window.activeFileManager.files[0];
    document.getElementById("acrobatDocName").textContent = file ? file.name : "document.pdf";
    document.getElementById("acrobatPageBadge").textContent = `${pdfEditorState.pdfDoc.numPages} page${pdfEditorState.pdfDoc.numPages === 1 ? "" : "s"}`;
    
    if (!acrobatState.listenersConfigured) {
        _setupAcrobatWorkspaceListeners();
        acrobatState.listenersConfigured = true;
    }
    
    acrobatState.activeTool = "select";
    acrobatState.selectedSpan = null;
    _acrobatSetActiveToolBtn("select");
    _acrobatShowToolProperties();
    
    _acrobatRenderPages();
}

function _setupAcrobatWorkspaceListeners() {
    document.querySelectorAll(".acrobat-tool-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            _acrobatDeselectCurrent();
            acrobatState.activeTool = btn.dataset.tool;
            _acrobatSetActiveToolBtn(btn.dataset.tool);
            _acrobatShowToolProperties();
            _acrobatRepaint();
        });
    });
    
    document.getElementById("acrobatZoomIn").addEventListener("click", () => {
        const levels = [0.75, 1.0, 1.2, 1.35, 1.5, 1.8, 2.0];
        let idx = levels.indexOf(acrobatState.zoom);
        if (idx === -1) idx = 3;
        if (idx < levels.length - 1) {
            acrobatState.zoom = levels[idx + 1];
            document.getElementById("acrobatZoomLabel").textContent = `${Math.round(acrobatState.zoom * 100)}%`;
            _acrobatRenderPages();
        }
    });
    
    document.getElementById("acrobatZoomOut").addEventListener("click", () => {
        const levels = [0.75, 1.0, 1.2, 1.35, 1.5, 1.8, 2.0];
        let idx = levels.indexOf(acrobatState.zoom);
        if (idx === -1) idx = 3;
        if (idx > 0) {
            acrobatState.zoom = levels[idx - 1];
            document.getElementById("acrobatZoomLabel").textContent = `${Math.round(acrobatState.zoom * 100)}%`;
            _acrobatRenderPages();
        }
    });
    
    document.getElementById("acrobatSaveBtn").addEventListener("click", () => {
        _acrobatDeselectCurrent();
        closeAcrobatWorkspace();
    });
    
    document.getElementById("acrobatCloseBtn").addEventListener("click", () => {
        _acrobatDeselectCurrent();
        closeAcrobatWorkspace();
    });
    
    document.getElementById("acrobatTextColor").addEventListener("input", () => {
        if (acrobatState.selectedSpan) {
            acrobatState.selectedSpan.frame.style.color = document.getElementById("acrobatTextColor").value;
            const action = _acrobatFindOrCreateSpanAction(acrobatState.selectedSpan);
            action.color = document.getElementById("acrobatTextColor").value;
            _syncPayload();
        }
    });
    
    document.getElementById("acrobatFontSize").addEventListener("input", () => {
        if (acrobatState.selectedSpan) {
            const val = Number(document.getElementById("acrobatFontSize").value) || 12;
            acrobatState.selectedSpan.frame.style.fontSize = `${val * acrobatState.zoom}px`;
            const action = _acrobatFindOrCreateSpanAction(acrobatState.selectedSpan);
            action.fontSize = val;
            _syncPayload();
        }
    });
    
    document.getElementById("acrobatDrawWidth").addEventListener("input", () => {
        document.getElementById("acrobatDrawWidthVal").textContent = document.getElementById("acrobatDrawWidth").value;
    });
    
    document.getElementById("acrobatFindText").addEventListener("input", _acrobatRepaint);
    document.getElementById("acrobatReplaceText").addEventListener("input", _acrobatRepaint);
    document.getElementById("acrobatReplaceColor").addEventListener("input", _acrobatRepaint);
    
    document.getElementById("acrobatUndoBtn").addEventListener("click", () => {
        _acrobatDeselectCurrent();
        pdfEditorState.actions.pop();
        _acrobatRepaint();
        _syncPayload();
        _acrobatUpdateStatusCount();
    });
    
    document.getElementById("acrobatClearBtn").addEventListener("click", () => {
        _acrobatDeselectCurrent();
        pdfEditorState.actions = [];
        _acrobatRepaint();
        _syncPayload();
        _acrobatUpdateStatusCount();
    });
}

function _acrobatSetActiveToolBtn(toolName) {
    document.querySelectorAll(".acrobat-tool-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tool === toolName);
    });
    // Switch overlay cursor based on active tool
    document.querySelectorAll(".pdf-editor-overlay").forEach(ov => {
        ov.className = "pdf-editor-overlay";
        if (toolName === "select") ov.classList.add("mode-select");
    });
}

function closeAcrobatWorkspace() {
    const modal = document.getElementById("acrobatModal");
    modal.style.display = "none";
    document.body.style.overflow = "";
    _syncPayload();
    
    const info = document.getElementById("launcherDocInfo");
    if (info) {
        const count = pdfEditorState.actions.length;
        info.textContent = `Acrobat editor holds ${count} edit${count === 1 ? "" : "s"} ready to apply. Click Process Files below to generate and download the edited PDF.`;
        info.classList.add("text-success");
        info.classList.remove("text-muted");
    }
}

async function _acrobatRenderPages() {
    const workspaceContainer = document.getElementById("acrobatCanvasContainer");
    const thumbContainer = document.getElementById("acrobatThumbnails");
    if (!workspaceContainer || !pdfEditorState.pdfDoc) return;
    
    workspaceContainer.innerHTML = "";
    thumbContainer.innerHTML = "";
    
    for (let p = 1; p <= pdfEditorState.pdfDoc.numPages; p++) {
        const page = await pdfEditorState.pdfDoc.getPage(p);
        
        const origVp = page.getViewport({ scale: 1.0 });
        pdfEditorState.pageSizes[p] = { width: origVp.width, height: origVp.height };
        const textContent = await page.getTextContent();
        pdfEditorState.pageTexts[p] = textContent.items.map(item => ({
            str: item.str,
            width: item.width,
            height: item.height,
            transform: item.transform
        }));
        
        const sc = acrobatState.zoom;
        const vp = page.getViewport({ scale: sc });
        
        const wrap = document.createElement("div");
        wrap.className = "pdf-editor-page";
        wrap.id = `acrobatPageWrap_${p}`;
        wrap.style.cssText = `width:${vp.width}px;height:${vp.height}px;`;
        
        const label = document.createElement("div");
        label.className = "pdf-page-label";
        label.textContent = `Page ${p}`;
        
        const canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        
        const dCanvas = document.createElement("canvas");
        dCanvas.className = "pdf-draw-canvas";
        dCanvas.width = vp.width; dCanvas.height = vp.height;
        
        const overlay = document.createElement("div");
        overlay.className = "pdf-editor-overlay";
        overlay.dataset.page = p;
        overlay.style.cssText = `width:${vp.width}px;height:${vp.height}px;`;
        
        overlay.addEventListener("pointerdown",  _acrobatOnDown);
        overlay.addEventListener("pointermove",  _acrobatOnMove);
        overlay.addEventListener("pointerup",    _acrobatOnUp);
        overlay.addEventListener("pointerleave", _acrobatOnUp);
        
        const badgeContainer = document.createElement("div");
        badgeContainer.className = "pdf-badge-container";
        
        wrap.append(canvas, dCanvas, overlay, label, badgeContainer);
        workspaceContainer.appendChild(wrap);
        
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        
        const thumbCard = document.createElement("div");
        thumbCard.className = `acrobat-thumb-card ${p === 1 ? "active" : ""}`;
        thumbCard.dataset.page = p;
        
        const thumbVp = page.getViewport({ scale: 0.18 });
        const thumbCanvas = document.createElement("canvas");
        thumbCanvas.width = thumbVp.width; thumbCanvas.height = thumbVp.height;
        
        const thumbLabel = document.createElement("span");
        thumbLabel.textContent = `Page ${p}`;
        
        thumbCard.append(thumbCanvas, thumbLabel);
        thumbContainer.appendChild(thumbCard);
        
        await page.render({ canvasContext: thumbCanvas.getContext("2d"), viewport: thumbVp }).promise;
        
        thumbCard.addEventListener("click", () => {
            document.querySelectorAll(".acrobat-thumb-card").forEach(c => c.classList.remove("active"));
            thumbCard.classList.add("active");
            wrap.scrollIntoView({ behavior: "smooth", block: "start" });
        });
    }
    
    // Apply cursor mode class to overlays based on current active tool
    document.querySelectorAll(".pdf-editor-overlay").forEach(ov => {
        if (acrobatState.activeTool === "select") ov.classList.add("mode-select");
    });
    
    _acrobatRepaint();
}

function _acrobatRepaint() {
    document.querySelectorAll(".pdf-edit-text, .pdf-edit-rect, .pdf-rotate-badge, .pdf-replace-badge, .pdf-text-frame").forEach(el => el.remove());
    document.querySelectorAll(".pdf-draw-canvas").forEach(c => c.getContext("2d").clearRect(0,0,c.width,c.height));
    
    const sc = acrobatState.zoom;
    
    for (const a of pdfEditorState.actions) {
        const ov = document.querySelector(`.pdf-editor-overlay[data-page="${a.page}"]`);
        if (!ov) continue;
        
        if (a.type === "rotate") {
            const wrap = ov.parentElement;
            const badge = document.createElement("div");
            badge.className = "pdf-rotate-badge";
            badge.textContent = `↻ ${a.degrees}°`;
            wrap.appendChild(badge);
        } else if (a.type === "text") {
            const d = document.createElement("div");
            d.className = "pdf-edit-text";
            d.textContent = a.text;
            Object.assign(d.style, {
                left: a.x * sc + "px",
                top: a.y * sc + "px",
                fontSize: a.fontSize * sc + "px",
                color: a.color
            });
            ov.appendChild(d);
        } else if (a.type === "replace") {
            const wrap = ov.parentElement;
            const badgeContainer = wrap.querySelector(".pdf-badge-container");
            if (badgeContainer) {
                const badge = document.createElement("div");
                badge.className = "pdf-replace-badge";
                badge.textContent = `✍ Replace "${a.find}" → "${a.replace}"`;
                badgeContainer.appendChild(badge);
            }
            
            const items = pdfEditorState.pageTexts ? (pdfEditorState.pageTexts[a.page] || []) : [];
            const size = pdfEditorState.pageSizes ? pdfEditorState.pageSizes[a.page] : null;
            if (size) {
                const ph = size.height;
                items.forEach(item => {
                    if (item.str.toLowerCase().includes(a.find.toLowerCase())) {
                        const tx = item.transform[4];
                        const ty = item.transform[5];
                        const th = item.height || 12;
                        const tw = item.width;
                        
                        const left = tx * sc;
                        const top = (ph - (ty + th)) * sc;
                        const width = tw * sc;
                        const height = th * sc;

                        const matchBox = document.createElement("div");
                        matchBox.className = "pdf-edit-rect";
                        Object.assign(matchBox.style, {
                            left: left + "px",
                            top: top + "px",
                            width: width + "px",
                            height: height + "px",
                            background: "rgba(6, 182, 212, 0.35)",
                            border: "1px solid rgba(6, 182, 212, 0.7)",
                            borderRadius: "2px"
                        });
                        ov.appendChild(matchBox);
                    }
                });
            }
        } else if (a.type === "highlight" || a.type === "whiteout") {
            const d = document.createElement("div");
            d.className = `pdf-edit-rect ${a.type === "whiteout" ? "pdf-edit-whiteout" : "pdf-edit-highlight"}`;
            Object.assign(d.style, {
                left: a.x * sc + "px",
                top: a.y * sc + "px",
                width: a.width * sc + "px",
                height: a.height * sc + "px"
            });
            if (a.type === "highlight") {
                d.style.background = _rgba(a.color, 0.35);
                d.style.borderColor = _rgba(a.color, 0.7);
            }
            ov.appendChild(d);
        } else if (a.type === "draw") {
            const ctx = ov.parentElement.querySelector(".pdf-draw-canvas").getContext("2d");
            ctx.strokeStyle = a.color;
            ctx.lineWidth = Math.max(1, a.lineWidth * sc);
            ctx.lineCap = "round";
            ctx.beginPath();
            a.points.forEach(([x,y],i) => {
                const cx = x * sc, cy = y * sc;
                i === 0 ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
            });
            ctx.stroke();
        } else if (a.type === "edit_text_span") {
            // Render edited text span locally covering the background
            const size = pdfEditorState.pageSizes[a.page];
            if (size) {
                const left = a.x * sc;
                const top = a.y * sc;
                const width = a.width * sc;
                const height = a.height * sc;
                
                const frame = document.createElement("div");
                frame.className = "pdf-text-frame";
                frame.style.background = "#ffffff"; // Covers underlying text
                frame.textContent = a.replace;
                Object.assign(frame.style, {
                    left: left + "px",
                    top: top + "px",
                    width: (width + 4) + "px",
                    height: (height + 2) + "px",
                    fontSize: (a.fontSize * sc) + "px",
                    color: a.color,
                    lineHeight: "1"
                });
                ov.appendChild(frame);
            }
        }
    }
    
    if (acrobatState.activeTool === "select") {
        document.querySelectorAll(".pdf-editor-overlay").forEach(ov => {
            const p = Number(ov.dataset.page);
            const items = pdfEditorState.pageTexts ? (pdfEditorState.pageTexts[p] || []) : [];
            const size = pdfEditorState.pageSizes ? pdfEditorState.pageSizes[p] : null;
            if (size) {
                const ph = size.height;
                items.forEach((item, index) => {
                    const action = pdfEditorState.actions.find(a => a.type === "edit_text_span" && a.page === p && Math.abs(a.x - item.transform[4]) < 0.5 && Math.abs(a.y - (ph - (item.transform[5] + (item.height || 12)))) < 0.5);
                    if (action) return; // Skip original rendering if edited action already handled above
                    
                    const tx = item.transform[4];
                    const ty = item.transform[5];
                    const th = item.height || 12;
                    const tw = item.width;
                    
                    const left = tx * sc;
                    const top = (ph - (ty + th)) * sc;
                    const width = tw * sc;
                    const height = th * sc;
                    
                    const frame = document.createElement("div");
                    frame.className = "pdf-text-frame";
                    frame.dataset.page = p;
                    frame.textContent = item.str;
                    
                    Object.assign(frame.style, {
                        left: left + "px",
                        top: top + "px",
                        width: (width + 4) + "px",
                        height: (height + 2) + "px",
                        fontSize: (th * sc) + "px",
                        color: "transparent", // invisible so we see underlying canvas text until focused/edited
                        lineHeight: "1"
                    });
                    
                    frame.addEventListener("pointerdown", (e) => {
                        // Prevent pointerdown from bubbling to overlay
                        e.stopPropagation();
                    });
                    frame.addEventListener("click", (e) => {
                        if (acrobatState.activeTool !== "select") return;
                        e.stopPropagation();
                        // Make text visible and enter editing mode
                        frame.style.color = "#000000";
                        _acrobatSelectFrame(frame, item, p, tx, ph - (ty + th), tw, th);
                    });
                    
                    ov.appendChild(frame);
                });
            }
        });
    }

    if (acrobatState.activeTool === "replace") {
        const findVal = (document.getElementById("acrobatFindText").value || "").trim();
        if (findVal) {
            document.querySelectorAll(".pdf-editor-overlay").forEach(ov => {
                const p = Number(ov.dataset.page);
                const items = pdfEditorState.pageTexts ? (pdfEditorState.pageTexts[p] || []) : [];
                const size = pdfEditorState.pageSizes ? pdfEditorState.pageSizes[p] : null;
                if (size) {
                    const ph = size.height;
                    items.forEach(item => {
                        if (item.str.toLowerCase().includes(findVal.toLowerCase())) {
                            const tx = item.transform[4];
                            const ty = item.transform[5];
                            const th = item.height || 12;
                            const tw = item.width;
                            
                            const left = tx * sc;
                            const top = (ph - (ty + th)) * sc;
                            const width = tw * sc;
                            const height = th * sc;

                            const activeMatchBox = document.createElement("div");
                            activeMatchBox.className = "pdf-edit-rect";
                            Object.assign(activeMatchBox.style, {
                                left: left + "px",
                                top: top + "px",
                                width: width + "px",
                                height: height + "px",
                                background: "rgba(234, 179, 8, 0.35)",
                                border: "1px solid rgba(234, 179, 8, 0.7)",
                                borderRadius: "2px"
                            });
                            ov.appendChild(activeMatchBox);
                        }
                    });
                }
            });
        }
    }
}

function _acrobatSelectFrame(frame, item, pageNum, x, y, width, height) {
    if (acrobatState.selectedSpan) {
        _acrobatDeselectCurrent();
    }
    
    acrobatState.selectedSpan = { frame, item, pageNum, x, y, width, height };
    frame.classList.add("focused");
    frame.contentEditable = "true";
    frame.focus();
    
    document.getElementById("acrobatPropDefault").style.display = "none";
    document.getElementById("acrobatPropText").style.display = "block";
    document.getElementById("acrobatNewTextValGroup").style.display = "none";
    
    const action = pdfEditorState.actions.find(a => a.type === "edit_text_span" && a.page === pageNum && Math.abs(a.x - x) < 0.5 && Math.abs(a.y - y) < 0.5);
    const sizeInput = document.getElementById("acrobatFontSize");
    const colorInput = document.getElementById("acrobatTextColor");
    
    if (action) {
        sizeInput.value = action.fontSize || Math.round(height);
        colorInput.value = action.color || "#000000";
    } else {
        sizeInput.value = Math.round(height);
        colorInput.value = "#000000";
    }
    
    frame.addEventListener("pointerdown", (e) => e.stopPropagation());
}

function _acrobatDeselectCurrent() {
    if (!acrobatState.selectedSpan) return;
    
    const { frame, item, pageNum, x, y, width, height } = acrobatState.selectedSpan;
    const newText = frame.textContent.trim();
    
    if (newText !== item.str) {
        let action = pdfEditorState.actions.find(a => a.type === "edit_text_span" && a.page === pageNum && Math.abs(a.x - x) < 0.5 && Math.abs(a.y - y) < 0.5);
        if (action) {
            action.replace = newText;
        } else {
            pdfEditorState.actions.push({
                type: "edit_text_span",
                page: pageNum,
                x: x,
                y: y,
                width: width,
                height: height,
                find: item.str,
                replace: newText,
                fontSize: Number(document.getElementById("acrobatFontSize").value) || Math.round(height),
                color: document.getElementById("acrobatTextColor").value
            });
        }
        _syncPayload();
        _acrobatUpdateStatusCount();
    }
    
    frame.contentEditable = "false";
    frame.classList.remove("focused");
    // Make text transparent again if it was unmodified
    if (newText === item.str) {
        frame.style.color = "transparent";
    }
    acrobatState.selectedSpan = null;
    _acrobatShowToolProperties();
    _acrobatRepaint();
}

function _acrobatFindOrCreateSpanAction(span) {
    const { pageNum, x, y, width, height, item } = span;
    let action = pdfEditorState.actions.find(a => a.type === "edit_text_span" && a.page === pageNum && Math.abs(a.x - x) < 0.5 && Math.abs(a.y - y) < 0.5);
    if (!action) {
        action = {
            type: "edit_text_span",
            page: pageNum,
            x: x,
            y: y,
            width: width,
            height: height,
            find: item.str,
            replace: span.frame.textContent.trim(),
            fontSize: Number(document.getElementById("acrobatFontSize").value) || Math.round(height),
            color: document.getElementById("acrobatTextColor").value
        };
        pdfEditorState.actions.push(action);
    }
    return action;
}

function _acrobatShowToolProperties() {
    const panels = ["acrobatPropText", "acrobatPropHighlight", "acrobatPropDraw", "acrobatPropReplace", "acrobatPropRotate"];
    panels.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = "none";
    });
    document.getElementById("acrobatPropDefault").style.display = "none";
    
    const t = acrobatState.activeTool;
    if (t === "select" || t === "text") {
        document.getElementById("acrobatPropText").style.display = "block";
        document.getElementById("acrobatNewTextValGroup").style.display = t === "text" ? "block" : "none";
    } else if (t === "highlight") {
        document.getElementById("acrobatPropHighlight").style.display = "block";
    } else if (t === "draw") {
        document.getElementById("acrobatPropDraw").style.display = "block";
    } else if (t === "replace") {
        document.getElementById("acrobatPropReplace").style.display = "block";
    } else if (t === "rotate") {
        document.getElementById("acrobatPropRotate").style.display = "block";
    } else {
        document.getElementById("acrobatPropDefault").style.display = "block";
    }
    
    const hint = document.getElementById("acrobatHintText");
    const labels = {
        select:    "Click on any text bounding box to edit existing content in-place.",
        text:      "Click anywhere on a page to insert new text.",
        highlight: "Click and drag to highlight document segments.",
        whiteout:  "Click and drag to redact/whiteout content blocks.",
        draw:      "Click and drag to draw freely with the brush pen.",
        replace:   "Type find query and replace text, then click on page to apply.",
        rotate:    "Click on any page in workspace to rotate it clockwise."
    };
    if (hint) hint.textContent = labels[t] || "Select a tool to modify elements.";
}

function _acrobatUpdateStatusCount() {
    const n = pdfEditorState.actions.length;
    const undoBtn = document.getElementById("acrobatUndoBtn");
    const clearBtn = document.getElementById("acrobatClearBtn");
    
    if (undoBtn) undoBtn.disabled = n === 0;
    if (clearBtn) clearBtn.disabled = n === 0;
}

function _acrobatOnDown(e) {
    if (!pdfEditorState.pdfDoc) return;
    
    // If clicking on a text frame, let the native click event handle it
    // do NOT call preventDefault so the frame's click listener fires normally
    if (e.target.classList.contains("pdf-text-frame")) {
        return;
    }
    
    // Deselect any currently selected text frame
    _acrobatDeselectCurrent();
    
    e.preventDefault();
    const overlay = e.currentTarget;
    overlay.setPointerCapture(e.pointerId);
    
    const start = _xyFrom(e, overlay);
    const tool = acrobatState.activeTool;
    const sc = acrobatState.zoom;
    
    if (tool === "rotate") {
        const degEl = document.getElementById("acrobatRotateDeg");
        const degrees = degEl ? Number(degEl.value) : 90;
        pdfEditorState.actions.push({ type: "rotate", page: start.page, degrees });
        _acrobatRepaint(); _syncPayload(); _acrobatUpdateStatusCount(); return;
    }
    if (tool === "text") {
        const txt = document.getElementById("acrobatNewTextVal").value || "New Text";
        pdfEditorState.actions.push({
            type: "text",
            page: start.page,
            x: start.x / sc,
            y: start.y / sc,
            text: txt,
            fontSize: Number(document.getElementById("acrobatFontSize").value) || 18,
            color: document.getElementById("acrobatTextColor").value
        });
        _acrobatRepaint(); _syncPayload(); _acrobatUpdateStatusCount(); return;
    }
    if (tool === "replace") {
        const findVal = (document.getElementById("acrobatFindText").value || "").trim();
        if (!findVal) {
            const hint = document.getElementById("acrobatHintText");
            if (hint) hint.textContent = "Please enter text to find first.";
            return;
        }
        const replVal = document.getElementById("acrobatReplaceText").value || "";
        const colorVal = document.getElementById("acrobatReplaceColor").value || "#000000";
        pdfEditorState.actions.push({
            type: "replace",
            page: start.page,
            find: findVal,
            replace: replVal,
            color: colorVal
        });
        _acrobatRepaint(); _syncPayload(); _acrobatUpdateStatusCount(); return;
    }
    if (tool === "draw") {
        const drawColor = document.getElementById("acrobatDrawColor").value || "#dc2626";
        const drawWidth = Number(document.getElementById("acrobatDrawWidth").value) || 3;
        acrobatState.drag = {
            type: "draw",
            page: start.page,
            overlay,
            points: [[start.x, start.y]],
            color: drawColor,
            lineWidth: drawWidth
        };
        return;
    }
    if (tool === "highlight" || tool === "whiteout") {
        const preview = document.createElement("div");
        preview.className = `pdf-edit-rect ${tool === "whiteout" ? "pdf-edit-whiteout" : "pdf-edit-highlight"}`;
        
        const highlightColor = document.getElementById("acrobatHighlightColor").value || "#facc15";
        if (tool === "highlight") {
            preview.style.background = _rgba(highlightColor, 0.35);
            preview.style.borderColor = _rgba(highlightColor, 0.7);
        }
        overlay.appendChild(preview);
        
        acrobatState.drag = {
            type: tool,
            page: start.page,
            overlay,
            start,
            preview,
            color: highlightColor
        };
    }
}

function _acrobatOnMove(e) {
    const d = acrobatState.drag; if (!d) return;
    e.preventDefault();
    const cur = _xyFrom(e, d.overlay);
    const sc = acrobatState.zoom;
    
    if (d.type === "draw") {
        const prev = d.points[d.points.length - 1];
        d.points.push([cur.x, cur.y]);
        const ctx = d.overlay.parentElement.querySelector(".pdf-draw-canvas").getContext("2d");
        ctx.strokeStyle = d.color;
        ctx.lineWidth = d.lineWidth * sc;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(prev[0], prev[1]);
        ctx.lineTo(cur.x, cur.y);
        ctx.stroke();
        return;
    }
    const b = _box(d.start, cur);
    Object.assign(d.preview.style, {
        left: b.x + "px",
        top: b.y + "px",
        width: b.w + "px",
        height: b.h + "px"
    });
}

function _acrobatOnUp(e) {
    const d = acrobatState.drag; if (!d) return;
    e.preventDefault();
    const end = _xyFrom(e, d.overlay);
    const sc = acrobatState.zoom;
    
    if (d.type === "draw") {
        if (d.points.length > 1) {
            pdfEditorState.actions.push({
                type: "draw",
                page: d.page,
                color: d.color,
                lineWidth: d.lineWidth,
                points: d.points.map(p => [p[0] / sc, p[1] / sc])
            });
        }
    } else {
        const b = _box(d.start, end);
        if (b.w > 4 && b.h > 4) {
            pdfEditorState.actions.push({
                type: d.type,
                page: d.page,
                color: d.color,
                x: b.x / sc,
                y: b.y / sc,
                width: b.w / sc,
                height: b.h / sc
            });
        }
    }
    acrobatState.drag = null;
    _acrobatRepaint(); _syncPayload(); _acrobatUpdateStatusCount();
}

function _xyFrom(e, overlay) {
    const r = overlay.getBoundingClientRect();
    return {
        page: Number(overlay.dataset.page),
        x: Math.max(0, Math.min(r.width,  e.clientX - r.left)),
        y: Math.max(0, Math.min(r.height, e.clientY - r.top))
    };
}

function _box(a, b) {
    return {
        x: Math.min(a.x, b.x),
        y: Math.min(a.y, b.y),
        w: Math.abs(b.x - a.x),
        h: Math.abs(b.y - a.y)
    };
}

function _rgba(hex, alpha) {
    const v = hex.replace("#","");
    const full = v.length === 3 ? v.split("").map(c => c+c).join("") : v;
    const r = parseInt(full.slice(0, 2), 16),
          g = parseInt(full.slice(2, 4), 16),
          b = parseInt(full.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function _syncPayload() {
    const inp = document.getElementById("pdfEditActions");
    if (inp) inp.value = JSON.stringify(pdfEditorState.actions);
}

function initTool(toolId, preserveAlerts) {

    document.getElementById("formMergeFormat").value = config.mergeFormat || "";

    // Clear previous dynamic inputs
    const inputsContainer = document.getElementById("dynamicInputs");
    inputsContainer.innerHTML = "";

    // If split action, render the Page Range settings input
    if (config.showPageRange) {
        const placeholder = config.pageRangePlaceholder || "e.g. 1-3, odd, even, or all";
        inputsContainer.innerHTML = `
            <div class="mt-3 text-start">
                <label for="page_range" class="form-label fw-bold text-secondary" style="font-size: 13px;">Page/Sheet Range to Extract</label>
                <input type="text" name="page_range" id="page_range" class="form-control text-center font-monospace" placeholder="${placeholder}" value="all">
            </div>
        `;
    }

    if (config.showPdfEditor) {

    }

// Sidebar Category filter action
function selectCategory(category, element) {
    // Toggle active link
    document.querySelectorAll('.menu-link').forEach(link => {
        link.classList.remove('active', 'active-all', 'active-pdf', 'active-word', 'active-excel', 'active-powerpoint', 'active-image');
    });

    const groups = document.querySelectorAll('.tool-section-group');

        } else {

// Search bar matching tool filter
function filterTools() {
    const query = document.getElementById("toolSearch").value.toLowerCase().trim();
    const cards = document.querySelectorAll('.tool-card');
    
    // Hide headers if search is active
    const headers = document.querySelectorAll('.section-header');

    if (query.length > 0) {
        headers.forEach(h => h.style.display = 'none');
        cards.forEach(card => {
            const title = card.querySelector('.tool-title').innerText.toLowerCase();
            const desc = card.querySelector('.tool-desc').innerText.toLowerCase();
            if (title.includes(query) || desc.includes(query)) {
                card.closest('.col-md-4').style.display = 'block';
                card.closest('.tool-section-group').style.display = 'block';
            } else {
                card.closest('.col-md-4').style.display = 'none';
            }
        });
    } else {
        // Reset category display
        headers.forEach(h => h.style.display = 'block');
        const activeLink = document.querySelector('.menu-link.active');
        const currentCategory = activeLink.innerText.toLowerCase().includes('all') ? 'all' : activeLink.innerText.toLowerCase().split(' ')[0];
        
        cards.forEach(card => card.closest('.col-md-4').style.display = 'block');
        selectCategory(currentCategory, activeLink);
    }
}

// Recent Downloads Logs List Handler using Django Database
function logDownload(fileName, downloadUrl) {
    // The backend now logs successful conversions automatically to the DB.
    // We just refresh the sidebar to show the newly added history record.
    renderRecentDownloads();
}

async function renderRecentDownloads() {
    const sidebarList = document.getElementById("recentDownloadsList");
    const sidebarContainer = document.querySelector(".recent-downloads");
    if (!sidebarList || !sidebarContainer) return;
    
    sidebarContainer.style.display = "block"; // Always keep sidebar history visible
    
    try {
        const response = await fetch("/history/");
        const data = await response.json();
        
        if (data.success && data.history && data.history.length > 0) {
            sidebarList.innerHTML = "";
            data.history.forEach(item => {
                const name = item.converted_filename || item.original_filename;
                const ext = name.split('.').pop().toLowerCase();
                let iconClass = 'far fa-file';
                if (ext === 'pdf') iconClass = 'far fa-file-pdf text-danger';
                else if (ext === 'docx') iconClass = 'far fa-file-word text-primary';
                else if (ext === 'xlsx' || ext === 'xls') iconClass = 'far fa-file-excel text-success';
                else if (ext === 'zip') iconClass = 'far fa-file-archive text-warning';

                const div = document.createElement('div');
                div.className = 'recent-item d-flex align-items-center justify-content-between py-2';
                div.innerHTML = `
                    <a href="${item.download_url}" class="recent-item-info text-truncate text-decoration-none d-flex align-items-center" style="max-width: 85%;" download>
                        <i class="${iconClass} me-2" style="font-size: 14px; flex-shrink: 0;"></i>
                        <span class="recent-item-name text-truncate" style="font-size: 13px; color: var(--text-secondary);" title="${name}">${name}</span>
                    </a>
                    <button class="btn btn-sm text-danger p-0 border-0 ms-2" onclick="deleteDownload(${item.id})" title="Delete Log">
                        <i class="fas fa-times-circle"></i>
                    </button>
                `;
                sidebarList.appendChild(div);
            });
        } else {
            sidebarList.innerHTML = `
                <div class="text-muted small py-3 px-2 text-center" style="font-size: 12px; border: 1.5px dashed var(--border-color); border-radius: 10px; background-color: var(--bg-body);">
                    <i class="fas fa-history d-block mb-1 text-muted" style="font-size: 14px;"></i>
                    No recent history
                </div>
            `;
        }
    } catch (error) {
        console.error("Error fetching recent history:", error);
    }
}

async function deleteDownload(itemId) {
    try {
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || "";
        const response = await fetch(`/history/delete/${itemId}/`, {
            method: "POST",
            headers: {
                "X-CSRFToken": csrfToken,
                "Content-Type": "application/x-www-form-urlencoded"
            }
        });
        const data = await response.json();
        if (data.success) {
            renderRecentDownloads();
        } else {
            console.error("Failed to delete history item:", data.error);
        }
    } catch (error) {
        console.error("Error deleting history item:", error);
    }
}

async function clearRecentDownloads() {
    // Shows confirmation before soft-deleting (marks INACTIVE) all active history records.
    // No records are permanently deleted from the database.
    const confirmed = confirm("Are you sure you want to clear your conversion history?\n\nNote: Records will be hidden but preserved in the database.");
    if (!confirmed) return;
    try {
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || "";
        const response = await fetch("/history/clear/", {
            method: "POST",
            headers: {
                "X-CSRFToken": csrfToken,
                "Content-Type": "application/x-www-form-urlencoded"
            }
        });
        const data = await response.json();
        if (data.success) {
            renderRecentDownloads();
        } else {
            console.error("Failed to clear history:", data.error);
        }
    } catch (error) {
        console.error("Error clearing history:", error);
    }
}

function animateDownload(btn, e) {
    if (btn.classList.contains("downloading")) {
        e.preventDefault();
        return;
    }
    
    btn.classList.add("downloading");
    const originalHTML = btn.innerHTML;
    
    // Confetti celebration
    triggerConfetti();
    
    btn.style.position = "relative";
    btn.style.overflow = "hidden";
    
    const progressBar = document.createElement("div");
    progressBar.style.position = "absolute";
    progressBar.style.top = "0";
    progressBar.style.left = "0";
    progressBar.style.height = "100%";
    progressBar.style.width = "0%";
    progressBar.style.background = "rgba(255, 255, 255, 0.25)";
    progressBar.style.transition = "width 0.08s linear";
    progressBar.style.zIndex = "1";
    btn.appendChild(progressBar);
    
    const textContainer = document.createElement("span");
    textContainer.style.position = "relative";
    textContainer.style.zIndex = "2";
    textContainer.innerHTML = `<i class="fas fa-spinner fa-spin me-1"></i>0%`;
    
    btn.innerHTML = "";
    btn.appendChild(progressBar);
    btn.appendChild(textContainer);
    
    let percent = 0;
    const interval = setInterval(() => {
        percent += 5;
        if (percent <= 100) {
            progressBar.style.width = percent + "%";
            textContainer.innerHTML = `<i class="fas fa-spinner fa-spin me-1"></i>${percent}%`;
        } else {
            clearInterval(interval);
            textContainer.innerHTML = `<i class="fas fa-check"></i>`;
            btn.style.background = "linear-gradient(135deg, var(--accent-green), #059669)";
            
            triggerConfetti();
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove("downloading");
                btn.style.background = "";
            }, 2000);
        }
    }, 40);
}

// Confetti celebration helper
function triggerConfetti() {
    const duration = 2500;
    const end = Date.now() + duration;
    
    if (!document.getElementById("confetti-style")) {
        const style = document.createElement("style");
        style.id = "confetti-style";
        style.innerHTML = `
            .confetti-piece {
                position: fixed;
                width: 10px;
                height: 10px;
                top: -10px;
                z-index: 99999;
                pointer-events: none;
                border-radius: 3px;
                animation: fall 2s linear forwards;
            }
            @keyframes fall {
                0% { transform: translateY(0) rotate(0deg); }
                100% { transform: translateY(105vh) rotate(720deg); }
            }
        `;
        document.head.appendChild(style);
    }

    const colors = ["#f43f5e", "#3b82f6", "#10b981", "#eab308", "#a855f7", "#06b6d4"];

    const interval = setInterval(() => {
        if (Date.now() > end) {
            clearInterval(interval);
            return;
        }

        const div = document.createElement("div");
        div.className = "confetti-piece";
        div.style.left = Math.random() * 100 + "vw";
        div.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        const size = Math.random() * 12 + 6;
        div.style.width = size + "px";
        div.style.height = size + "px";
        div.style.opacity = Math.random() * 0.7 + 0.3;
        div.style.animationDuration = Math.random() * 1.5 + 1.5 + "s";
        
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2500);
    }, 35);
}

    loadSavedTheme();
    renderRecentDownloads();
    
    // Hide active loader

    // Auto log completed server downloads
    const downloadBtn = document.getElementById("downloadBtn");
    if (downloadBtn) {
        const downloadUrl = downloadBtn.getAttribute("href");
        if (downloadUrl && downloadUrl !== "#") {
            const filename = downloadUrl.split('/').pop();
            logDownload(filename, downloadUrl);
            triggerConfetti();
        }

        // Bind interactive animation events to download button
        downloadBtn.addEventListener("click", function(e) {
            if (this.classList.contains("downloading")) {
                e.preventDefault();
                return;
            }
            
            this.classList.add("downloading");
            const originalHTML = this.innerHTML;
            
            // Trigger confetti celebration on click
            triggerConfetti();
            
            // Build visual progress bar overlays
            this.style.position = "relative";
            this.style.overflow = "hidden";
            
            const progressBar = document.createElement("div");
            progressBar.style.position = "absolute";
            progressBar.style.top = "0";
            progressBar.style.left = "0";
            progressBar.style.height = "100%";
            progressBar.style.width = "0%";
            progressBar.style.background = "rgba(255, 255, 255, 0.25)";
            progressBar.style.transition = "width 0.08s linear";
            progressBar.style.zIndex = "1";
            this.appendChild(progressBar);
            
            const textContainer = document.createElement("span");
            textContainer.style.position = "relative";
            textContainer.style.zIndex = "2";
            textContainer.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i>Downloading... <span class="percent">0%</span>`;
            
            this.innerHTML = "";
            this.appendChild(progressBar);
            this.appendChild(textContainer);
            
            let percent = 0;
            const interval = setInterval(() => {
                percent += 4;
                if (percent <= 100) {
                    progressBar.style.width = percent + "%";
                    const percentText = textContainer.querySelector(".percent");
                    if (percentText) percentText.innerText = percent + "%";
                } else {
                    clearInterval(interval);
                    textContainer.innerHTML = `<i class="fas fa-check me-2"></i>Downloaded!`;
                    this.style.background = "linear-gradient(135deg, var(--accent-green), #059669)";
                    this.style.boxShadow = "0 8px 25px -5px rgba(16, 185, 129, 0.5)";
                    
                    // Extra spark of confetti on complete
                    triggerConfetti();
                    
                    setTimeout(() => {
                        this.innerHTML = originalHTML;
                        this.classList.remove("downloading");
                        this.style.background = "";
                        this.style.boxShadow = "";
                    }, 2500);
                }
            }, 50);
        });
    }

    // Auto open tool from page context or localStorage
    if (window.__INIT_TOOL__ && document.getElementById(window.__INIT_TOOL__)) {
        if (window.__INIT_CATEGORY__ && window.__INIT_CATEGORY__ !== 'all') {
            const catLink = document.querySelector(`.menu-link[onclick*="'${window.__INIT_CATEGORY__}'"]`);
            if (catLink) {
                selectCategory(window.__INIT_CATEGORY__, catLink);
            }
        }
        initTool(window.__INIT_TOOL__, true);
    } else if (window.__INIT_CATEGORY__ && window.__INIT_CATEGORY__ !== 'all') {
        const catLink = document.querySelector(`.menu-link[onclick*="'${window.__INIT_CATEGORY__}'"]`);
        if (catLink) {
            selectCategory(window.__INIT_CATEGORY__, catLink);
        }
    } else {
        const activeToolId = localStorage.getItem('activeToolId');
        if (activeToolId && document.getElementById(activeToolId)) {
            initTool(activeToolId, true);
        }
    }
});
</script>
