    <!-- Sidebar -->

            <i class="fas fa-file-invoice"></i> Docu<span>Converter Pro</span>

        <!-- Theme Toggle Slider -->

            <button type="button" id="themeToggleBtn" class="btn btn-sm btn-outline-custom border-0 p-1" onclick="toggleThemeMode()" title="Toggle Theme Mode">

        <ul class="menu-list">
            <li class="menu-item">
                <a href="#" class="menu-link active-all" onclick="selectCategory('all', this)">
                    <i class="fas fa-th-large"></i> All Tools
                </a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link" onclick="selectCategory('pdf', this)">
                    <i class="far fa-file-pdf text-danger"></i> PDF Tools
                </a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link" onclick="selectCategory('word', this)">
                    <i class="far fa-file-word text-primary"></i> Word Tools
                </a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link" onclick="selectCategory('excel', this)">
                    <i class="far fa-file-excel text-success"></i> Excel Tools
                </a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link" onclick="selectCategory('powerpoint', this)">

                </a>
            </li>
            <li class="menu-item">
                <a href="#" class="menu-link" onclick="selectCategory('image', this)">
                    <i class="far fa-image" style="color: #a855f7 !important;"></i> Image Tools
                </a>
            </li>

        <!-- Recent history list -->
        <div class="recent-downloads">
            <div class="recent-title">
