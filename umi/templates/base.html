{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UMI - Your Intelligent AI Assistant. Chat, explore ideas, and get things done.">
    <title>{% block title %}UMI — Intelligent AI Assistant{% endblock %}</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Highlight.js Theme (dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="highlight-theme">

    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link href="{% static 'css/animations.css' %}" rel="stylesheet">
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet">
    
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Formatting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container d-flex h-100 overflow-hidden">
        <!-- Sidebar -->
        {% include 'sidebar.html' %}
        
        <!-- Main Content Area -->
        <main class="main-content flex-grow-1 d-flex flex-column overflow-hidden">
            <!-- Page Content -->
            <div class="content-wrapper flex-grow-1 overflow-hidden position-relative d-flex flex-column">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;">
        <div id="dummyToast" class="toast align-items-center text-white border-0 rounded-3" role="alert" style="background: linear-gradient(135deg, #4F46E5, #6366F1); box-shadow: 0 8px 24px rgba(79,70,229,0.35);">
            <div class="d-flex">
                <div class="toast-body fw-medium" id="dummyToastBody">Action performed!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS (order matters) -->
    <script src="{% static 'js/theme.js' %}?v=1.3"></script>
    <script src="{% static 'js/ui.js' %}?v=1.3"></script>
    <script src="{% static 'js/sidebar.js' %}?v=1.3"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
