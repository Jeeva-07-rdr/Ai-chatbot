<div class="chat-input-wrapper position-fixed bottom-0 start-0 w-100 p-3 pt-4 pe-md-4 pb-md-4">
    <div class="max-w-800 mx-auto w-100">
        <!-- File Attachment Preview Area -->
        <div id="filePreviewArea" class="d-none flex-wrap gap-2 px-3 py-2 border rounded-4 mb-2 shadow-sm" style="border-color: var(--border-color) !important; background-color: var(--card-bg);"></div>
        
        <!-- Floating Pill Input Container -->
        <div class="chat-input-container d-flex align-items-center" id="chatInputContainer">
            <!-- File Attachment Button -->
            <input type="file" id="fileInput" multiple style="display: none;">
            <button class="btn btn-icon text-muted hover-lift p-0 me-2 d-flex align-items-center justify-content-center" id="attachBtn" title="Attach file" style="min-width: 34px; height: 34px; border-radius: 50%;">
                <i class="bi bi-paperclip fs-5" style="transform: rotate(45deg); color: var(--text-muted);"></i>
            </button>
            
            <!-- Textarea -->
            <textarea class="form-control bg-transparent border-0 shadow-none py-1 mx-1" id="chatInput" rows="1" placeholder="Ask anything..." aria-label="Chat input" style="resize: none; max-height: 200px; color: var(--text-main); font-size: 0.95rem;"></textarea>
            
            <!-- Action Buttons (Mic, Circular Blue Send) -->
            <div class="d-flex align-items-center gap-1 ms-1">
                <button class="btn btn-icon text-muted hover-lift p-0 d-flex align-items-center justify-content-center" id="micBtn" title="Voice Input" style="min-width: 32px; height: 32px; border-radius: 50%;">
                    <i class="bi bi-mic fs-5" style="color: var(--text-muted);"></i>
                </button>
                <button class="btn send-btn ms-2 d-flex align-items-center justify-content-center" id="sendBtn" title="Send message">
                    <i class="bi bi-arrow-up fs-5 text-white"></i>
                </button>
            </div>
        </div>

        <!-- Subtext below input -->
        <div class="d-flex flex-column align-items-center mt-2 text-muted ultra-small" style="font-size: 0.72rem; color: var(--text-muted) !important; opacity: 0.85;">
            <div class="mb-1">Enter to send &nbsp;•&nbsp; Shift+Enter for new line</div>
            <div>UMI can make mistakes. Consider verifying important information.</div>
        </div>
    </div>
</div>
